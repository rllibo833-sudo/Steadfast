name: Deploy JBF Asset Studio

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Confirm isolated Worker target
        run: |
          python - <<'PY'
          import tomllib
          with open("kits/jbf-asset-studio/wrangler.toml", "rb") as f:
              config = tomllib.load(f)
          assert config.get("name") == "jbf-asset-studio", "Refusing deployment: Worker name mismatch"
          PY
      - name: Deploy isolated JBF Asset Studio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.153.0 deploy \
            --name jbf-asset-studio \
            --config kits/jbf-asset-studio/wrangler.toml
          printf 'Asset Studio: https://jbf-asset-studio.fadlibo833.workers.dev\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish owner-approved contact channels
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JBF_BUSINESS_EMAIL: ${{ secrets.JBF_BUSINESS_EMAIL }}
          JBF_BUSINESS_WHATSAPP: ${{ secrets.JBF_BUSINESS_WHATSAPP }}
        run: |
          test -n "$JBF_BUSINESS_EMAIL"
          test -n "$JBF_BUSINESS_WHATSAPP"
          printf '%s' "$JBF_BUSINESS_EMAIL" | npx --yes wrangler@4.153.0 secret put BUSINESS_EMAIL \
            --name jbf-asset-studio \
            --config kits/jbf-asset-studio/wrangler.toml
          printf '%s' "$JBF_BUSINESS_WHATSAPP" | npx --yes wrangler@4.153.0 secret put BUSINESS_WHATSAPP \
            --name jbf-asset-studio \
            --config kits/jbf-asset-studio/wrangler.toml
