name: Deploy JBF Cloud Agent

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Worker build runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install agent dependencies
        run: npm install --prefix kits/jbf-cloud-agent --no-audit --no-fund
      - name: Verify provider routing and types
        working-directory: kits/jbf-cloud-agent
        run: npm test && npm run typecheck
      - name: Require the JBF owner token
        run: test -n "$JBF_OWNER_TOKEN"
        env:
          JBF_OWNER_TOKEN: ${{ secrets.JBF_OWNER_TOKEN }}
      - name: Confirm isolated Worker target
        run: |
          python - <<'PY'
          import tomllib
          with open("kits/jbf-cloud-agent/wrangler.toml", "rb") as f:
              config = tomllib.load(f)
          assert config.get("name") == "jbf-cloud-agent", "Refusing deployment: Worker name mismatch"
          PY
      - name: Deploy isolated JBF Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.153.0 deploy \
            --name jbf-cloud-agent \
            --config kits/jbf-cloud-agent/wrangler.toml
          worker_url="https://jbf-cloud-agent.fadlibo833.workers.dev"
          printf '%s\n' "$worker_url" > jbf-worker-url.txt
          printf 'Worker: %s\n' "$worker_url" >> "$GITHUB_STEP_SUMMARY"
      - name: Install owner token on the isolated JBF Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JBF_OWNER_TOKEN: ${{ secrets.JBF_OWNER_TOKEN }}
        run: |
          printf '%s' "$JBF_OWNER_TOKEN" | npx --yes wrangler@4.153.0 secret put OWNER_TOKEN \
            --name jbf-cloud-agent \
            --config kits/jbf-cloud-agent/wrangler.toml
      - name: Install existing connector credentials on the isolated JBF Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JBF_GITHUB_TOKEN: ${{ secrets.JBF_GITHUB_TOKEN }}
        run: |
          test -n "$JBF_GITHUB_TOKEN"
          printf '%s' "$JBF_GITHUB_TOKEN" | npx --yes wrangler@4.153.0 secret put GITHUB_TOKEN \
            --name jbf-cloud-agent \
            --config kits/jbf-cloud-agent/wrangler.toml
          printf '%s' "$CLOUDFLARE_API_TOKEN" | npx --yes wrangler@4.153.0 secret put CLOUDFLARE_API_TOKEN \
            --name jbf-cloud-agent \
            --config kits/jbf-cloud-agent/wrangler.toml
      - name: Install the owner-approved OpenRouter free-only fallback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JBF_OPENROUTER_API_KEY: ${{ secrets.JBF_OPENROUTER_API_KEY }}
        run: |
          test -n "$JBF_OPENROUTER_API_KEY"
          printf '%s' "$JBF_OPENROUTER_API_KEY" | npx --yes wrangler@4.153.0 secret put OPENROUTER_API_KEY \
            --name jbf-cloud-agent \
            --config kits/jbf-cloud-agent/wrangler.toml
      - name: Install the optional Groq free-tier fallback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JBF_GROQ_API_KEY: ${{ secrets.JBF_GROQ_API_KEY }}
        run: |
          if [ -n "$JBF_GROQ_API_KEY" ]; then
            printf '%s' "$JBF_GROQ_API_KEY" | npx --yes wrangler@4.153.0 secret put GROQ_API_KEY \
              --name jbf-cloud-agent \
              --config kits/jbf-cloud-agent/wrangler.toml
          else
            echo "JBF_GROQ_API_KEY is absent; Groq Free fallback remains unavailable."
          fi
      - name: Install the optional Cerebras Free-tier fallback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JBF_CEREBRAS_API_KEY: ${{ secrets.JBF_CEREBRAS_API_KEY }}
        run: |
          if [ -n "$JBF_CEREBRAS_API_KEY" ]; then
            printf '%s' "$JBF_CEREBRAS_API_KEY" | npx --yes wrangler@4.153.0 secret put CEREBRAS_API_KEY \
              --name jbf-cloud-agent \
              --config kits/jbf-cloud-agent/wrangler.toml
          else
            echo "JBF_CEREBRAS_API_KEY is absent; Cerebras Free fallback remains unavailable."
          fi
      - name: Install the optional NVIDIA NIM Free Endpoint fallback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JBF_NVIDIA_API_KEY: ${{ secrets.JBF_NVIDIA_API_KEY }}
        run: |
          if [ -n "$JBF_NVIDIA_API_KEY" ]; then
            printf '%s' "$JBF_NVIDIA_API_KEY" | npx --yes wrangler@4.153.0 secret put NVIDIA_API_KEY \
              --name jbf-cloud-agent \
              --config kits/jbf-cloud-agent/wrangler.toml
          else
            echo "JBF_NVIDIA_API_KEY is absent; NVIDIA NIM Free Endpoint fallback remains unavailable."
          fi
      - name: Install optional Gemini Free-tier fallback only with owner data-use approval
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JBF_GEMINI_API_KEY: ${{ secrets.JBF_GEMINI_API_KEY }}
          JBF_GEMINI_FREE_DATA_APPROVED: ${{ vars.JBF_GEMINI_FREE_DATA_APPROVED }}
        run: |
          if [ -n "$JBF_GEMINI_API_KEY" ] && [ "$JBF_GEMINI_FREE_DATA_APPROVED" = "true" ]; then
            printf '%s' "$JBF_GEMINI_API_KEY" | npx --yes wrangler@4.153.0 secret put GEMINI_API_KEY \
              --name jbf-cloud-agent \
              --config kits/jbf-cloud-agent/wrangler.toml
            printf 'true' | npx --yes wrangler@4.153.0 secret put GEMINI_FREE_DATA_APPROVED \
              --name jbf-cloud-agent \
              --config kits/jbf-cloud-agent/wrangler.toml
          else
            echo "Gemini is not enabled; it requires its API key and owner approval of free-tier data use."
          fi
      - name: Install owner-provided business contact on the isolated JBF Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JBF_BUSINESS_EMAIL: ${{ secrets.JBF_BUSINESS_EMAIL }}
          JBF_BUSINESS_WHATSAPP: ${{ secrets.JBF_BUSINESS_WHATSAPP }}
        run: |
          test -n "$JBF_BUSINESS_EMAIL"
          test -n "$JBF_BUSINESS_WHATSAPP"
          printf '%s' "$JBF_BUSINESS_EMAIL" | npx --yes wrangler@4.153.0 secret put BUSINESS_EMAIL \
            --name jbf-cloud-agent \
            --config kits/jbf-cloud-agent/wrangler.toml
          printf '%s' "$JBF_BUSINESS_WHATSAPP" | npx --yes wrangler@4.153.0 secret put BUSINESS_WHATSAPP \
            --name jbf-cloud-agent \
            --config kits/jbf-cloud-agent/wrangler.toml
      - name: Publish Worker URL as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jbf-cloud-agent-url
          path: jbf-worker-url.txt
          retention-days: 7
