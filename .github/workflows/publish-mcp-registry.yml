name: Publish to Official MCP Registry

on:
  workflow_run:
    workflows: ["Publish to PyPI"]
    types: [completed]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out released source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Install MCP Publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          sudo install mcp-publisher /usr/local/bin/mcp-publisher
      - name: Validate registry manifest
        run: mcp-publisher validate server.json
      - name: Authenticate with GitHub OIDC
        run: mcp-publisher login github-oidc
      - name: Publish Steadfast to Official MCP Registry
        run: mcp-publisher publish server.json
