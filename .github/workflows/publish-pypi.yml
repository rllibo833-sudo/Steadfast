name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build source and wheel distributions
        run: python -m build
      - name: Validate package metadata and artifacts
        run: python -m twine check --strict dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@0b7f8abb1508181956e8e162db84b466c27e18ce # v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Explain manual validation-only runs
        if: github.event_name == 'workflow_dispatch'
        run: |
          {
            echo "## PyPI publication"
            echo ""
            echo "This was a manual validation run: distributions were built and checked, but publishing is intentionally skipped."
            echo "To publish, publish a GitHub Release. The release event triggers the trusted PyPI publisher job."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish trusted distribution to PyPI
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/steadfast-governance/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI using trusted publishing
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # release/v1
