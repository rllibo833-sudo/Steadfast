name: PyPI adoption smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: steadfast-pypi-smoke
  cancel-in-progress: false

jobs:
  install-and-verify:
    name: Test the published package as a consumer would
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install published PyPI package
        run: python -m pip install --disable-pip-version-check --upgrade steadfast-governance

      - name: Record installed version
        run: steadfast --help

      - name: Run consumer commands and preserve output
        id: verify
        shell: bash
        run: |
          set +e
          steadfast --repo . verify > steadfast-verification.json 2> steadfast-verification.stderr
          result=$?
          set -e
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          steadfast --repo . report --format markdown > steadfast-report.md
          echo "Published package verification exit code: $result"

      - name: Upload consumer test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steadfast-pypi-smoke-${{ github.run_id }}
          path: |
            steadfast-verification.json
            steadfast-verification.stderr
            steadfast-report.md
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce published package result
        if: always()
        shell: bash
        env:
          VERIFY_EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
        run: |
          if [ "${VERIFY_EXIT_CODE:-2}" != "0" ]; then
            echo "The published PyPI package installed, but verification did not pass. Download the report artifact to inspect the result."
            exit 1
          fi
