name: PyPI adoption smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: steadfast-pypi-smoke
  cancel-in-progress: false

jobs:
  install-and-verify:
    name: Test the published package as a consumer would
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install published PyPI package
        run: python -m pip install --disable-pip-version-check --upgrade steadfast-governance

      - name: Confirm CLI entry point
        run: steadfast --help

      - name: Run consumer commands and preserve output
        id: smoke
        shell: bash
        run: |
          set +e
          steadfast --repo . verify > steadfast-verification.json 2> steadfast-verification.stderr
          verify_result=$?
          steadfast --repo . report --format markdown > steadfast-report.md 2> steadfast-report.stderr
          report_result=$?
          set -e

          echo "verify_exit_code=$verify_result" >> "$GITHUB_OUTPUT"
          echo "report_exit_code=$report_result" >> "$GITHUB_OUTPUT"

          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("steadfast-verification.json").read_text(encoding="utf-8"))
          if not isinstance(data, dict) or "passed" not in data:
              raise SystemExit("verify command did not emit the expected JSON object with a 'passed' field")
          report = Path("steadfast-report.md").read_text(encoding="utf-8")
          if not report.strip():
              raise SystemExit("report command emitted an empty Markdown report")
          print(f"Verification executed; policy passed={data['passed']!r}.")
          print(f"Markdown report generated ({len(report)} characters).")
          PY

          if [ "$report_result" -gt 1 ]; then
            echo "The report command encountered a CLI/runtime error (exit $report_result); see the uploaded stderr/report artifacts."
            exit "$report_result"
          fi
          echo "The published package CLI and report path are operational. Policy findings may return exit 1 and are recorded separately; they do not by themselves mean package installation or CLI execution is broken."

      - name: Upload consumer test report
        if: always()
        uses: actions/upload-artifact@0b7f8abb1508181956e8e162db84b466c27e18ce # v4
        with:
          name: steadfast-pypi-smoke-${{ github.run_id }}
          path: |
            steadfast-verification.json
            steadfast-verification.stderr
            steadfast-report.md
            steadfast-report.stderr
          if-no-files-found: warn
          retention-days: 14
