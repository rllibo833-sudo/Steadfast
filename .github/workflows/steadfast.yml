name: Steadfast governance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Audit repository
        run: steadfast audit
      - name: Check evidence
        run: steadfast evidence-check
      - name: Smoke-test CLI commands
        run: |
          steadfast --help
          python -m steadfast --help
          steadfast inventory
          steadfast goal-check
          steadfast docs-check
          steadfast code-truth
          steadfast security-check
          steadfast report --format json
          steadfast report --format sarif
