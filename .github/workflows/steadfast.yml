name: Steadfast governance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Audit repository
        run: steadfast audit
      - name: Check evidence
        run: steadfast evidence-check
      - name: Smoke-test CLI commands
        run: |
          steadfast --help
          python -m steadfast --help
          steadfast inventory
          steadfast goal-check
          steadfast docs-check
          steadfast code-truth
          steadfast security-check
          steadfast report --format json
          steadfast report --format sarif
      - name: Run complete NCM model
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JBF_GITHUB_TOKEN: ${{ secrets.JBF_GITHUB_TOKEN }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python -m steadfast --repo . ncm \
            --output .steadfast/artifacts/next-concept-model.json
      - name: Upload NCM model artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: next-concept-model
          path: .steadfast/artifacts/next-concept-model.json
          if-no-files-found: error
          retention-days: 14
