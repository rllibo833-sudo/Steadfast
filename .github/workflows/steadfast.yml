name: Steadfast governance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Audit repository
        run: steadfast audit
      - name: Check evidence
        run: steadfast evidence-check
      - name: Smoke-test CLI commands
        run: |
          steadfast --help
          python -m steadfast --help
          steadfast inventory
          steadfast goal-check
          steadfast docs-check
          steadfast code-truth
          steadfast security-check
          steadfast report --format json
          steadfast report --format sarif
      - name: Checkout Pusingcuk
        if: github.event_name != 'pull_request'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: rllibo833-sudo/pusingcuk
          path: .steadfast/projects/pusingcuk
          persist-credentials: false
      - name: Checkout Mnemos-RLI
        if: github.event_name != 'pull_request'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: rllibo833-sudo/mnemos-RLI
          path: .steadfast/projects/mnemos-rli
          persist-credentials: false
      - name: Checkout ECOS archive
        if: github.event_name != 'pull_request'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: rllibo833-sudo/ECOS
          path: .steadfast/projects/ecos
          persist-credentials: false
      - name: Checkout Kawasan Masjid public site
        if: github.event_name != 'pull_request'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: rllibo833-sudo/kawasan-masjid-public
          path: .steadfast/projects/core-public
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: github.event_name != 'pull_request'
        with:
          node-version: "22"
      - name: Install project adapter dependencies
        if: github.event_name != 'pull_request'
        run: |
          python -m pip install "cryptography>=42"
          npm install --no-audit --no-fund
        working-directory: .steadfast/projects/core-public
      - name: Run complete NCM model
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JBF_GITHUB_TOKEN: ${{ secrets.JBF_GITHUB_TOKEN }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NCM_API_KEY: ${{ secrets.NCM_API_KEY || secrets.JBF_OPENROUTER_API_KEY }}
          NCM_BASE_URL: ${{ vars.NCM_BASE_URL }}
          NCM_MODEL: ${{ vars.NCM_MODEL }}
          NCM_PROJECT_ROOTS: '{"pusingcuk":".steadfast/projects/pusingcuk","mnemos-rli":".steadfast/projects/mnemos-rli","ecos":".steadfast/projects/ecos","core-public":".steadfast/projects/core-public"}'
        run: |
          python -m steadfast --repo . ncm \
            --allow-remote \
            --allow-source-content-remote \
            --output .steadfast/artifacts/next-concept-model.json
      - name: Upload NCM model artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: next-concept-model
          path: .steadfast/artifacts/next-concept-model.json
          if-no-files-found: error
          retention-days: 14
