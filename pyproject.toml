[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steadfast-governance"
version = "0.4.1"
description = "Local-first repository governance CLI for coding-agent scope, evidence, security signals, and release checks."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Steadfast contributors"}]
keywords = ["governance", "code-truth", "mcp", "ai-agents", "ecosystem"]
dependencies = [
  "mcp>=1.2.0",
  "pyyaml>=6.0",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "black>=23.0",
  "ruff>=0.1",
  "mypy>=1.7",
  "pre-commit>=3.5",
  "types-pyyaml>=6.0",
]
docs = [
  "sphinx>=7.0",
  "sphinx-rtd-theme>=1.3",
]

[project.scripts]
steadfast = "steadfast.cli:main"

[project.entry-points."mcp.servers"]
steadfast = "steadfast.mcp_server:main"

[project.entry-points."steadfast.skills"]
doc-sync = "steadfast.integrations:doc_sync_skill"
scope-guard = "steadfast.integrations:scope_guard_skill"
evidence-check = "steadfast.integrations:evidence_check_skill"
repo-audit = "steadfast.integrations:repo_audit_skill"
release-readiness = "steadfast.integrations:release_readiness_skill"

[project.entry-points."steadfast.plugins"]
auto = "steadfast.ecosystem:discover_plugins"

[project.urls]
Homepage = "https://github.com/rllibo833-sudo/Steadfast"
Repository = "https://github.com/rllibo833-sudo/Steadfast"
Issues = "https://github.com/rllibo833-sudo/Steadfast/issues"
Security = "https://github.com/rllibo833-sudo/Steadfast/security/advisories"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
steadfast = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\\.pyi?$'

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]  # Line too long (handled by Black)

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
ignore_missing_imports = true
strict_optional = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["*Test*"]
python_functions = ["test_*"]
