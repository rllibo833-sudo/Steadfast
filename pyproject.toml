[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steadfast-governance"
version = "0.1.0"
description = "Evidence-based repository governance for coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Steadfast contributors"}]
dependencies = []

[project.scripts]
steadfast = "steadfast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
